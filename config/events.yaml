# Study events after the S1 acquisition audit (20 Sep 2026, outputs/audit/summary.csv).
# co: co-event S1 date(s) + relative orbit; dry: dry-season window for the same-path baseline median.
# coherence: true -> SLC burst processing (urban only). bbox = [W, S, E, N].
rural:
  kerala_2018:
    bbox: [76.20, 9.05, 76.95, 10.30]
    co: [{date: 2018-08-21, path: 165, dir: DESCENDING}]       # peak; GEE script used DESC too
    extra: [{date: 2018-08-09, path: 165, note: flood onset — NOT a valid pre-event baseline}]
    dry: [2018-01-01, 2018-04-30]
    coherence: false
    compare: "PLOS One 2020 Otsu OA 94.1% (21 Aug); Curr Sci 2021 CSI 81.6% (Alappuzha/Kottayam)"
    districts: [Ernakulam, Kottayam, Alappuzha]       # 2024 GEE AOI (GAUL, 5767.41 km²; reported flood 112.92 km²)
    zooms:                                            # 10 m detail windows for the report: [lon, lat, size_km]
      kochi_urban: [76.285, 9.975, 6]
      aluva_periyar: [76.355, 10.110, 6]
      kuttanad_paddy: [76.400, 9.450, 6]
      chengannur: [76.615, 9.320, 6]
    zoom_labels:                                      # display names (default: title-case of the key)
      kochi_urban: Kochi Urban
      aluva_periyar: Aluva — Periyar
      kuttanad_paddy: Kuttanad Paddy
      chengannur: Chengannur
    exclude_methods: [gee2024]                        # kept as an appendix audit, out of the comparative tables
    coherence:                                        # HyP3 burst InSAR (optional, needs Earthdata login)
      path: 165
      bbox: [76.20, 9.25, 76.70, 10.20]
      pre: [2018-07-16, 2018-07-28]
      co: [2018-08-09, 2018-08-21]
      dry: [2018-02-10, 2018-02-22]                 # non-monsoon anchor, same relative orbit
    published:                                        # literature comparators shown in the report
      - {source: "Otsu on S1 in GEE, PLOS One 2020", metric: "OA", value: 0.941, date: 2018-08-21, area: "Kerala state"}
      - {source: "ALOS-2 + S1 rule-based, Current Science 2021", metric: "CSI", value: 0.816, date: 2018-08-21, area: "Alappuzha + Kottayam"}
      - {source: "2024 GEE script (this author)", metric: "area_km2", value: 112.92, date: 2018-08-21, area: "3 districts (GAUL)"}
  assam_2020:
    bbox: [93.00, 26.60, 94.00, 26.90]
    co: [{date: 2020-07-15, path: 143, dir: ASCENDING}]
    dry: [2020-01-01, 2020-03-31]
    coherence: false
    compare: "DeepSARFlood Assam 2020 demo; Mudi 2022 >=87% vs S2"
  assam_2022:
    bbox: [93.00, 26.60, 94.00, 26.90]
    co: [{date: 2022-06-16, path: 41, dir: ASCENDING}, {date: 2022-08-10, path: 143, dir: ASCENDING}]
    dry: [2022-01-01, 2022-03-31]
    coherence: false
    compare: "DeepSARFlood 10 Aug 2022 vs S2 labels (same AOI)"
    districts: auto                                   # every ADM2 polygon intersecting the bbox
    # zooms: omitted -> windows are centred on the largest flood clusters
    coherence:                                        # HyP3 burst InSAR on the 10 Aug (p143) scene
      path: 143
      bbox: [93.00, 26.60, 94.00, 26.90]
      dry: [2022-02-11, 2022-02-23]                   # non-monsoon anchor (the lesson from Kerala)
      pre: [2022-07-17, 2022-07-29]
      co: [2022-07-29, 2022-08-10]
    published:
      - {source: "DeepSARFlood (2025), S2-derived labels", metric: "IoU", value: 0.72, date: 2022-08-10, area: "same AOI"}
  bihar_2020:
    bbox: [85.70, 25.80, 86.60, 26.50]
    co: [{date: 2020-07-26, path: 121, dir: DESCENDING}, {date: 2020-07-30, path: 12, dir: ASCENDING}]
    dry: [2020-01-01, 2020-04-30]
    coherence: false
    compare: "GEE threshold Bihar 2020: OA 93.81%, kappa 0.70"
urban:
  bengaluru_2022:
    bbox: [77.45, 12.80, 77.80, 13.15]
    co: [{date: 2022-09-05, path: 165, dir: DESCENDING}]       # ~06:00 IST, hours after the 4 Sep night storm
    dry: [2022-01-01, 2022-04-30]
    compare: "none peer-reviewed -> GFM + reported locations (ORR, Bellandur, Yemalur, Mahadevapura)"
    districts: auto
    zooms:                                            # locations reported flooded on 5 Sep 2022 [lon, lat, size_km]
      bellandur_varthur: [77.680, 12.940, 6]
      mahadevapura_orr: [77.700, 12.990, 5]
      sai_layout_horamavu: [77.660, 13.030, 4]
      sarjapur_rainbow: [77.720, 12.890, 4]
    zoom_labels:
      bellandur_varthur: Bellandur — Varthur
      mahadevapura_orr: Mahadevapura — ORR
      sai_layout_horamavu: Sai Layout — Horamavu
      sarjapur_rainbow: Sarjapur — Rainbow Drive
    coherence:                                        # p165 DESC; dry anchor + pre + co, 12-day steps
      path: 165
      bbox: [77.45, 12.80, 77.80, 13.15]
      dry_window: [2022-01-01, 2022-04-30]            # auto -> 2022-01-08 / 2022-01-20 (12 d)
      pre: [2022-07-31, 2022-08-12]                   # 12 d, the last clean pair before the storm
      co: [2022-08-12, 2022-09-05]                    # 24 d: p165 skipped the 24 Aug cycle, so the co pair spans two cycles
  delhi_2023:
    bbox: [77.10, 28.45, 77.40, 28.90]
    co: [{date: 2023-07-16, path: 27, dir: ASCENDING}]         # peak
    extra: [{date: 2023-07-12, path: 136}, {date: 2023-07-19, path: 63, note: no PC RTC}, {date: 2023-07-24, path: 136}]
    dry: [2023-01-01, 2023-04-30]
    coherence: true
    compare: "ArcIndia 2025 NCI timing: onset 12, peak 16, recession 24 Jul"
  hyderabad_2020:
    bbox: [78.25, 17.20, 78.70, 17.60]
    co: [{date: 2020-10-21, path: 165, dir: DESCENDING}]       # +7 d after 13-14 Oct, +3 d after 17-18 Oct -> residual water only
    extra: [{date: 2020-10-09, path: 165, note: clean pre-event}]
    dry: [2020-01-01, 2020-04-30]
    coherence: true
    compare: "HEC-RAS modelled extent (Curr Sci 2021) -> residual-inundation / detectability case"
  mumbai_2024:
    bbox: [72.77, 18.88, 73.05, 19.30]
    # No near-peak acquisition exists: path 34 DESC is the ONLY orbit over Mumbai in 2024, at a strict 12-day repeat.
    # The 8 Jul and 26 Sep episodes fall +3 d and -5 d from the nearest passes, so this event is run as a
    # DETECTABILITY case: the same rule on every pass of the season, to see whether 11 Jul is separable at all.
    co:
      - {date: 2024-07-11, path: 34, dir: DESCENDING}         # +3 d after the 8 Jul cloudburst — the event candidate
      - {date: 2024-06-17, path: 34, dir: DESCENDING}
      - {date: 2024-06-29, path: 34, dir: DESCENDING}
      - {date: 2024-07-23, path: 34, dir: DESCENDING}
      - {date: 2024-08-16, path: 34, dir: DESCENDING}
      - {date: 2024-08-28, path: 34, dir: DESCENDING}
      - {date: 2024-09-09, path: 34, dir: DESCENDING}
      - {date: 2024-09-21, path: 34, dir: DESCENDING}         # -5 d before the 26 Sep deluge
      - {date: 2024-10-03, path: 34, dir: DESCENDING}
    event_date: 2024-07-11                                    # the pass under test in the detectability series
    dry: [2024-01-01, 2024-04-30]
    compare: "Mumbai S1 2018-25 study (VV vs VH extents, ward-level)"
    districts: auto
    intertidal: [10, 90]                              # GSW occurrence band: creeks, mudflats and salt pans that move with the tide
    zooms:                                            # recurring flooding hotspots [lon, lat, size_km]
      mithi_kurla: [72.885, 19.070, 5]
      andheri_subway: [72.848, 19.119, 4]
      sion_dharavi: [72.862, 19.042, 4]
      hindmata_dadar: [72.840, 19.015, 4]
    zoom_labels:
      mithi_kurla: Mithi River — Kurla
      andheri_subway: Andheri Subway
      sion_dharavi: Sion — Dharavi
      hindmata_dadar: Hindmata — Dadar
    coherence:                                        # p34 DESC, 12-day steps around the co-event date (re-check after the audit)
      path: 34
      bbox: [72.77, 18.88, 73.05, 19.30]
      dry: [2024-02-06, 2024-02-18]
      pre: [2024-06-17, 2024-06-29]
      co: [2024-06-29, 2024-07-11]
dropped:
  chennai_2023: "no S1 IW acquisition 1-18 Dec 2023 -> EOS-04 only (Bhoonidhi, manual); qualitative panel at most"
  wayanad_2024: "landslide/debris flow, not inundation"
